ων προσώπων, ήτοι—\n(α) ιατρός'\n(6) οδοντίατρος\"\n(γ) κτηνίατρος'\n(δ) φαρμακοποιός'\n(ε) εξουσιοδοτημένος πωλητής δηλητηρίων\n(στ) προϊσταμένη αδελφή ή αναπληρώτρια προϊσταμένη αδελφή—\n(i) Κυβερνητικού Νοσοκομείου ή Κυβερνητικού 'Ιδρύ­\nματος'\n(ii) Νοσοκομείου ή Ιδρύματος δπερ ήθελε τύχει της εγ­\nκρίσεως του Υπουργού δυνάμει της ύπο—υποπαρα­\nγράφου (ii) της υποπαραγράφου (στ) της παραγρά­\nφου (2) του Κανονισμού 7'\n(ζ) άδελφαι ή άναπληρώτριαι τούτων αιτινες ήθελον εκάστοτε\nείναι υπεύθυνοι θαλάμου, χειρουργείου ή έτερου τμήμοπος\nέν τοιούτω Νοσοκομείω ή Ίδρύματι έν τη περιπτώσει καθ'\nην τα φάρμακα προμηθεύονται εις αύτάς ύπό προσώπου\nυπευθύνου διά τήν παροχήν φαρμάκων κατόπιν συνταγής\nκαι διά τήν προμήθειαν φαρμάκων διά τό τοιούτο Νοσοκο­\nμεΐον ή \"Ιδρυμα\"\n(η) ό 'Ανώτερος Κυβερνητικός Χημικός, ol Κυβερνητικοί Χημι­\nκοί ή οιοσδήποτε έτερος χημικός εξουσιοδοτημένος ύπό του\nΥπουργού'\n(θ) πρόσωπα προϊστάμενα εργαστηρίων χρησιμοποιουμένων δι'\nέρευνας ή διδασκαλίαν και προσηρτημένα είς—\n(i) Πανεπιστήμια, Πανεπιστημιακά Κολλεγια, Τεχνικά\nΚολλέγια ή Κυβερνητικά Νοσοκομεία'\n(ii) παν έτερον Ιδρυμα δπερ ήθελε τύχει της, εγκρίσεως\nτου Υπουργού δυνάμει της ύπο—υποπαραγράφου (ii)\nτης υποπαραγράφου (η) της παραγράφου (2) του\nΚανονισμού Τ\nΚεφ.261 (ι) πρόσωπα ασκούντα καθήκοντα λειτουργών δειγματοληψίας\n34 TOO 1967. έν τη έννοια και δυνάμει του περί Πωλήσεως Φαρμάκων και\nΤροφίμων Νόμου'\nΚεφ­254. (κ) πρόσωπα εξουσιοδοτημένα ύπό του Υπουργού δυνάμει του\n34τοθΐ967. άρθρου 35 τοΰ περί Φαρμακευτικής και Δηλητηρίων.Νόμου,\nδύναται, οσάκις ενεργεί ύπό τήν τοιαύτην ιδιότητα του, νά προμηθεύς\nή νά προσφέρηται νά προμηθεύη οιονδήποτε φάρμακον καθορίζαμε­\n417 Κ.Δ.Π. 160/79\nνον έν τω Τρίτω Πίνακι είς οιονδήποτε πρόσωπον δπερ δύναται νο­\nμίμως νά έχη το τοιούτο φάρμακον έν τη κατοχή του :\nΝοείται δτι ουδέν των έν τη παρούση παραγράφω διαλαμβανομέ­\nνων εξουσιοδοτεί—\n(i) την προΐσταμένην άδελφήν ή άναπληρώτριαν προΐσταμένην\nάδελφήν Κυβερνητικού Νοσοκομείου ή Κυβερνητικού \"Ιδρύ­\nματος ή οιουδήποτε έτερου Νοσοκομείου ή 'Ιδρύματος, δπερ\nήθελεν έγκριθή υπό του Υπουργού δυνάμει της ύπο­ύποπαρα­\nγράφου (ii) της υποπαραγράφου (στ) της παραγράφου (2)\nτου Κανονισμού 7, έχοντος φαρμακοποιόν ύπεύθυνον δια τήν\nπαροχήν φαρμάκων κατόπιν συνταγής και προμήθειαν φαρ­\nμάκων, νά προμηθεύη ή νά προσφέρηται νά προμηθεύη οιον­\nδήποτε τοιούτο φάρμακον\n(ii) άδελφάς ή αναπληρώτριας άδελφάς αΐτινες ήθελον εκάστοτε\nείναι υπεύθυνοι θαλάμου/χειρουργείου ή έτερου τμήματος\nνά προμηθεύουν οιονδήποτε φάρμακον άλλως ή διά χορη­\nγήσεως τούτου εις ασθενή τινά έν τω ως εϊρηται θαλάμω,\nχειρουργείω ή τμήμοαι συμφώνως προς τάς οδηγίας Ιατρού\nή οδοντιάτρου.\n(3) 'Ανεξαρτήτως των διατάξεων της υποπαραγράφου (β) της\nπαραγράφου (1) του άρθρου 5 τοϋ Νόμου, οιονδήποτε πρόσωπον\nδπερ είναι έξουσιοδοτημένον ως μέλος ομάδος δύναται δυνάμει και\nσυμφώνως προς τους δρους της εξουσιοδοτήσεως της ομάδος του και\nκατά συμμόρφωσιν προς τους δρους ταύτης, νά προμηθεύη ή νά προσ­\nφέρηται νά προμηθεύη οιονδήποτε φάρμακον καθοριζόμενον έν τω\nΤρίτω Πίνακι των τταρόντων Κανονισμών εις οιονδήποτε πρόσωπον\nόπερ δύναται νομίμως νά έχη το έν λόγω φάρμακον έν τη κατοχή\nαύτου.\n(4) 'Ανεξαρτήτως τών διατάξεων της υποπαραγράφου (β) της πα­\nραγράφου (1) τοΰ άρθρου 5 τοΰ Νόμου—\n(α) οιονδήποτε πρόσωπον ούτινος το όνομα περιέχεται εκάστοτε\nάναγεγραμμένον έν τω μητρώω τω τηρουμένω διά τους σκο­\nπούς της παρούσης υποπαραγράφου ύπό τοΟ Υπουργού δύ­\nναται, έν τοΐς ύποστατικοΐς έν σχέσει προς τά όποια το\nδνομά του είναι ούτως άναγεγραμμένον καΐ συμφώνως προς\nτους δρους ύπό τήν έπιφύλαξιν τών οποίων το δνομά του\nείναι ούτως άναγεγραμμένον, νά προμηθεύη ή να προσφέ­\nρηται νά προμηθεύη οιονδήποτε φάρμακον καθοριζόμενον\nέν τω Τρίτω Πίνακι είς οιονδήποτε πρόσωπον δπερ δύναται\nνομίμως νά έχη το έν λόγω φάρμακον έν τη κατοχή αύτοΰ'\n(6) οιονδήποτε πρόσωπον ούτινος το δνομα εκάστοτε περιέχεται\nέν τω μητρώω τω τηρουμένω διά τους σκοπούς της υποπα­\nραγράφου (γ) της παραγράφου (1) του παρόντος Κανο­\nνισμού ύπό του Υπουργού, δύναται νά προμηθεύη ή νά προσ­\nφέρηται νά προμηθεύη οιονδήποτε φάρμακον δπερ ούτος\nδύναται, δυνάμει της τοιαύτης αναγραφής του ονόματος του,\nνομίμως νά παράγη, είς οιονδήποτε πρόσωπον δπερ νομίμως\nδύναται νά έχη το έν λόγω φάρμακον έν­τη κατοχή αυτού.\n(5) 'Ανεξαρτήτως των διατάξεων της υποπαραγράφου (β) της\nπαραγράφου (1) του άρθρου 5 του Νόμου, ό πλοιοκτήτης ή ό πλοί­\nαρχος Κυπριακού πλοίου ή ό κυβερνήτης Κυπριακού αεροσκάφους\nδπερ δέν περιλαμβάνει έν τω πληρώματι αύτου ίατρόν, δύναται να\nπρομηθεύη ή νά προσφέρηται να προμηθεύη οιονδήποτε φάρμακον\nκαθοριζόμενον έν τω Τρίτω Πίνακι—\n(i) είς οιονδήποτε μέλος του πληρώματος' ή\n(ii) είς οιονδήποτε πρόσωπον δπερ δύναται νομίμως νά προμη­\nθεύη τό φάρμακον.\nΚατοχή 9.—(1) 'Ανεξαρτήτως των διατάξεων της υποπαραγράφου (δ) της\nφαρμάκων παραγράφου (1) του άρθρου 5 του Νόμου—\nδιαλαμβα­\nνομένων έν (α) παν πρόσωπον καθοριζόμενον έν τη παραγράφω (2) του\nτω Δευτέρω Κανονισμού 7 δύναται νά εχη έν τη κατοχή αύτου οιονδή­\nχαΙΤρίπρ ποτε φάρμακον καθοριζόμενον έν τω Δευτέρω Πίνακι δια\nflLvoncu\nσκοπούς ενεργείας Οπό την τοιαύτην ιδιότητα του\"\n(δ) πάν πρόσωπον καθοριζόμενον έν τη παραγράφω (2) του\nΚανονισμού 8 δύναται νά εχη έν τη κατοχή αύτοΰ φάρμακον\nκαθοριζόμενον έν τω Τρίτω Πίνακι, διά σκοπούς ενεργείας\nύπό την τοιαύτην ιδιότητα του.\n(2) 'Ανεξαρτήτως των διατάξεων τοϋ εδαφίου (1) του άρθρου 6\nτου Νόμου οιονδήποτε πρόσωπον δύναται νά εχη έν τη κατοχή αύτου\nοιονδήποτε φάρμακον καθοριζόμενον έν τω Δευτέρω και Τρίτω Πί­\nνακι διά χορήγησιν δι' ιατρικούς, οδοντιατρικούς ή κτηνιατρυχούς\nσκοπούς, συμφώνως προς τάς οδηγίας ιατρού, οδοντιάτρου ή κτηνιά­\nτρου :\nΝοείται δτι ή παρούσα παράγραφος δεν θά ίσχύη έν τη περιπτώσει\nπροσώπου είς τό όποιον τό φάρμακον παρεσχέθη δυνάμει συνταγής\nίστρου έάν—\n(α) κατά τόν αυτόν χρόνον έπρομηθεύετο είς αυτόν έλεγχόμε­\nνον φάρμακον ύπό ετέρου ιατρού ή δάσει συνταγής αύτου\nκαι δεν απεκάλυψε τό γεγονός είς τόν πρώτον μνησθέντα\nίατρόν πριν ή ούτος προμηθεύση είς αυτόν τό έλεγχόμενον\nφάρμακον ή έκδώση συνταγήν διά τούτο'\n(6) τό έν λόγω πρόσωπον ή οιονδήποτε έτερον πρόσωπον διά\nλογαριασμόν αύτου, προέδη είς δήλωσιν ή δεδαίωσιν ίνα\nέπιτύχη την τοιαύτην προμήθειαν ή εκδοσιν συνταγής* και ή\nδήλωσις ή δεδαίωσις ήτο ψευδής εν τινι στοιχείω αυτής.\n(3) 'Ανεξαρτήτως των διατάξεων του εδαφίου (1) του άρθρου 6\nτου Νόμου, πρόσωπον δπερ είναι έξουσιοδοτημένον ώς μέλος ομάδος\nδύνοααι, δυνάμει και συμφώνως προς τους δρους τής εξουσιοδοτή­\nσεως της ομάδος του και κατά συμμόρφωσιν προς οιουσδήποτε δρους\nταύτης, νά εχη έν τη κατοχή αύτοΰ οιονδήποτε φάρμακον καθοριζό­\nμενον έν τω Δευτέρω ή Τρίτω Πίνακι.\n(4) 'Ανεξαρτήτως των διατάξεων του εδαφίου (1) τοΟ άρθρου 6\nτου Νόμου—\n(α) οιονδήποτε πρόσωπον ούτινος τό δνομα περιέχεται εκάστοτε\nάναγεγραμμένον έν τω μητρώω τω τηρουμένω διά τους σκο­\nπούς της παρούσης υποπαραγράφου ύπό του 'Υπουργού δύ­\nναται, συμφώνως προς τους δρους ύπό τήν έπιφύλαξιν των\nοποίων τό δνομά του είναι άναγεγραμμένον, νά εχη έν τη\nκατοχή αύτοΰ οιονδήποτε φάρμακον καθοριζόμενον έν τω\nΤρίτω Πίνακι των παρόντων Κανονισμών\n(δ) οιονδήποτε πρόσωπον ούτινος τό δνομα περιέχεται εκάστοτε\nάναγεγραμμένον έν τω μητρώω τω τηρουμένω διά τους σκο­\nπούς τής υποπαραγράφου (γ) τής παραγράφου (1) τοΟ Κα­\nνονισμού 8 ύπό του Υπουργού, δύναται νά εχη έν τη κατοχή\n419 Κ.Δ.Π. 160/79\nαύτοΰ οιονδήποτε φάρμακον δπερ ούτος δύναται, δυνάμει\nτης τοιαύτης αναγραφής τοΟ ονόματος του, να παράγη νο­\nμίμως'\n(γ) οιονδήποτε πρόσωπον ούτινος το δνομα περιέχεται εκάστοτε\nούτω άναγεγραμμένον έν­τώ μητρώω τω τηρουμένω διά\nτους σκοπούς της υποπαραγράφου (α) της παραγράφου\n(4) του Κανονισμού ­8 υπό του Υπουργού δύναται να εχη\nέν τη κατοχή αότοΰ οιονδήποτε φάρμακον δπερ ούτος δύ­\nναται, δυνάμει ,χής τοιαύτης^άναγραφής του ονόματος του,\nνομίμως να προμηθεύη.\n(5) 'Ανεξαρτήτως των διατάξεων του εδαφίου (1) τοΰ άρθρου 6\nτου Νόμου—\n(α) ό πλοιοκτήτης ή ό πλοίαρχος Κυπριακού πλοίου, ή ό κυ­\nβερνήτης Κυπριακού αεροσκάφους, δπερ δέν περιλαμβάνει\nέν τω πληρώματι αύτοΰ Ίατρόν, δύναται να έχη έν τη κα­\nτοχή αύτοΰ οιονδήποτε φάρμακον καθοριζόμενονέν τω Δεύ­\nτε ρω ή Τρίτω Πίνακι συμφώνως προς οιουσδήποτε δρους\nεπιβαλλόμενους ύπό τοΰ 'Υπουργοΰ'\n(β) ό πλοίαρχος μη Κυπριακού πλοίου ή ό κυβερνήτης μή Κυ­\nπριακού αεροσκάφους, δπερ ευρίσκεται εν τινι λιμένι ή άέρο­\nλιμένι της Δημοκρατίας, δύναται να εχη έν τη κατοχή αύτοΰ\nοιονδήποτε φάρμακον καθοριζόμενον έν τω Δευτέρω ή Τρίτω\nΠίνακι καθ' ην έκτασιν τούτο είναι άναγκαΐον διά τον έφο­\nδιασμόν τοΰ πλοίου ή αεροσκάφους.\nΜΕΡΟΣ II\nΠΡΟΜΗΘΕΙΑ ΦΑΡΜΑΚΩΝ ΚΑΙ ΤΗΡΗΣΙΣ ΒΙΒΛΙΩΝ\nΚΑΙ ΑΡΧΕΙΟΥ"},{"id":"law-narcotics-kdp79-art-9","lawId":"law-narcotics-kdp79","partId":"law-narcotics-kdp79-part-1","number":"αρ.9","titleGr":"Kατοχή φαρμάκων του Δευτέρου και Τρίτου Πίνακα","page":8,"notes":[{"level":1,"text":"Δεύτερος πίνακας  όπως στο αρ.7"},{"level":1,"text":"Τρίτος πίνακας  όπως στο αρ.8"},{"level":1,"text":"οποιοδήποτε πρόσωπο δύναται να κατέχει φάρμακο Δευτέρου ή Τρίτου Πίνακα που του χορηγήθηκε για ιατρικούς, οδοντιατρικούς ή κτηνιατρικούς σκοπούς"},{"level":1,"text":"Εξουσιοδοτημένα μέλη ομάδων και πρόσωπα εγγεγραμμένα στα μητρώα του Υπουργού"},{"level":1,"text":"Πλοιοκτήτες, πλοίαρχοι Κυπριακών πλοίων ή κυβερνήτες Κυπριακών αεροσκαφών χωρίς ιατρό, καθώς και πλοίαρχοι/κυβερνήτες ξένων πλοίων/αεροσκαφών σε λιμάνι ή αερολιμένα της Δημοκρατίας, μπορούν να κατέχουν φάρμακα Δευτέρου ή Τρίτου Πίνακα στον βαθμό που είναι αναγκαίο για τον εφοδιασμό του πλοίου ή αεροσκάφου"}],"fullText":"9. Παν σκεύασμα ή άλλον προϊόν περιέχον οίανδήποτε των ουσιών ή οιονδή­\nποτε των προϊόντων τών αναφερομένων έν ταϊς άνω παραγράφοις 6, 7 και 8, μ ή δν\nσκεύασμα άναφερόμενον είς τον Πρώτον Πίνακα.\nΤΡΙΤΟΣ ΠΤΝΑΞ\n(Κανονισμοί 6, 8, 9, 10, 11, 12 και 22)."},{"id":"law-narcotics-kdp79-art-10","lawId":"law-narcotics-kdp79","partId":"law-narcotics-kdp79-part-2","number":"αρ.10","titleGr":"Έγγραφα που απαιτούνται για την προμήθεια ελεγχόμενων φαρμάκων","page":9,"notes":[{"level":1,"text":"τι έγγραφα πρέπει να λαμβάνει ο προμηθευτής πριν παραδώσει φάρμακο, για να διασφαλιστεί ότι ο αποδέκτης είναι νομίμως εξουσιοδοτημένος"},{"level":1,"text":"Αν ο αποδέκτης δεν είναι ο ίδιος αλλά εκπρόσωπός του, πρέπει να επιδείξει έγγραφη δήλωση εξουσιοδότησης υπογεγραμμένη από τον πραγματικό αποδέκτη"},{"level":1,"text":"Για προμήθεια σε επαγγελματίες (ιατρούς, οδοντιάτρους, κτηνιάτρους, νοσηλευτές, χημικούς, πλοιάρχους) απαιτείται έγγραφο διατακτικό (υπογραφή παραλήπτη, όνομα/επάγγελμα/διεύθυνση, σκοπό χρήσης και ολική ποσότητα αριθμητικώς και ολογράφως)"},{"level":1,"text":"Αν ιατρός/οδοντίατρος/κτηνίατρος δηλώσει επείγουσα ανάγκη, το φάρμακο μπορεί να παραδοθεί χωρίς διατακτικό — αλλά ο παραλήπτης αναλαμβάνει υποχρέωση να το παράσχει εντός 24 ωρών"},{"level":1,"text":"Διατακτικά για νοσηλευτικό προσωπικό Νοσοκομείων πρέπει να υπογράφονται από ιατρό του ίδιου Νοσοκομείου"},{"level":1,"text":"Διατακτικά για πλοία μη Κυπριακής σημαίας πρέπει να συνοδεύονται από δήλωση του ιατρικού λειτουργού λιμένος"},{"level":1,"text":"Το άρθρο δεν εφαρμόζεται για φάρμακα Πρώτου Πίνακα"}],"fullText":"10.— (1) 'Οσάκις οιοδήποτε πρόσωπον (έν τοις εφεξής άναφε­ Έγγραφα\nρόμενον ώς «ό προμηθειυτής») δπερ δέν είναι Ιατρός, οδοντίατρος, ^\"«δέον\nή κτηνίατρος προμηθεύει έλεγχόμενον φάρμακον άλλως ή διά συντα­ ^rrmCmo­roO\nγης, ό προμηθευτής δεν θά παραδίδη το φάρμακον ε'ις πρόσωπον προμηθειΛοΟ\nΟϊπερ— ­ έλεγχσμΕΛΐων\n( , α) ν ι » σ χυρι , ζ ν ετεαι ο c τ ι έ i στα , λ .. η υ c π ο < η » έ , κ μέ , ρ ους προσ \" ώ . π ' ου εις , το , φ Ύ α ^ ρ ^ μ άκων.\n(\nόποιον τοΰτο προμηθεύεται (έν τοις εφεξής έν τη παρούση\nπαραγράφω αναφερομένου ώς «ό παραλήπτης»)' καί\n(β) δέν είναι εξουσιοδοτημένο ν δι* οιασδήποτε διατάξεως τών\nπαρόντων Κανονισμών πλην τών διατάξεων της παραγρά­\nφου (στ) τοΰ Κανονισμού 5 να εχη έν τη κατοχή αύτοΰ\nφάρμακα,\nέκτος έάν το έν λόγω πρόσωπον παρουσίαση .εις τον προμηθευτήν\nέγγραφον δήλωσαν ύπογεγραμμένην ύπό τοΰ παραλήπτου ότι ούτος\nεξουσιοδοτείται ύπό τοΰ παραλήπτου νά λάβη το έν λόγω φάρμα­\nκον έκ μέρους του καί ό προμηθευτής ευλόγως ικανοποιείται δτι\nτο έν λόγω έγγραφον είναι γνήσιον.\n(2) 'Οσάκις οιονδήποτε πρόσωπον (έν τοΐς εφεξής έν τη παρούση\nπαραγράφω άναφερόμενον ώς «ό προμηθευτής») προμηθεύει ελεγ­\nχόμενον . φάρμακον άλλως­ή δια συνταγής εις οιονδήποτε τών έν τη\nπαραγράφω (4) καθοριζομένων προσώπων, ό προμηθευτής δεν θά\nπαραδίδη το φάρμακον— ....·.\n(α), μέχρις δτου λάβη έγγραφον διατακτικόν δπερ —\n(i) είναι ύπογεγραμμενον ύπό προσώπου εις τό όποιον\nτο φάρμακον ­προμηθεύεται (έν τοΐς εφεξής έν τη\n■; παρούση παραγράφω άνα(|>ερομένου ώς «ό παρα­\nλήπτης»)'\n(ii) δήλοι το όνομα, το επάγγελμα και την διεύθυνσιν\nτοΟπαραλήπτου'\n(iii) καθορίζει τον σκοπόν δια τον όποιον­το προμηιθευό­\nμενον φάρμακον απαιτείται και την προσφερθη,σομέ­\nνην όλικήν ποσότητα^ και\n(iv) δπου τούτο είναι έφαρμόσιμον, ικανοποιεί τάς προ­\nϋποθέσεις της κάτωθι παραγράφου (5)\" και\n(β) έκτος έάν οδτος ίκανοποιηθη ευλόγως δτι ή υπογραφή\nείναι του προσώπου τοΰ φερομένου ώς υπογράφοντος το\nδιατακτικόν και δτι τό έν λόγω πρόσωπον απασχολείται\nέν τω έπαγγέλματι τω καθοριζομένω έν τω διατακτικω:\nΝοείται δτι οσάκις ό παραλήπτης είναι ιατρός, οδοντίατρος ή κτη­\nνίατρος και παριστάνει δτι επειγόντως χρειάζεται τό έλεγχόμενον\nφάρμακον δια τους επαγγελματικούς του σκοπούς, ό προμηθευτής,\nέάν ήθελεν ευλόγως ίκανοποιηθη δτι ό παραλήπτης τω δντι χρειά­\nζεται τό φάρμακον .καί, λόγω έκτακτου ανάγκης, abavaxei προ της\nπαραδόσεως νά. έφοδιάση τον προμηιθευτήν δι' έγγραφου διατα­\nκτικού δεόντως υπογεγραμμένου, δύναται νά παραδώση. τό φάρ­\nμακον εις τον παραλήπτην έφ' δσον οδτος αναλαμβάνει ύποχρέωσιν\nνά προμηιθεύση τό έν λόγω διατακτικόν εντός των προσεχών είκοσι­\nτεσσσάρων ωρών.\n(3) Πάν πρόσωπον δπερ έχει αναλάβει τήν ώς εΐρηται ύποχρέω­\nσιν οφείλει νά παράσχη, εις τό πρόσωπον παρά του οποίου έχει\nπρομηιθευθή τό έλεγχόμενον φάρμακον, τό εγγραφον διατακτικόν\nσυμφώνως τη ύπ' αύτοΟ άναληφθείση υποχρεώσει..\n(4) Τά πρόσωπα εις τά όποια ή άνω παράγραφος (2) αναφέ­\nρεται εΐναι: —\n(α) ιατρός'\n(β) οδοντίατρος\"\n(γ) κτηνίατρος\"\n(δ) ή προϊσταμένη αδελφή ή αναπληρώτρια προϊσταμένη αδελ­\nφή —\n(i) Κυβερνητικού Νοσοκομείου ή Κυβερνητικού 'Ιδρύ­\nματος'\n(ii)Νοσοκομείου ή 'Ιδρύματος δπερ ήθελε τύχει της εγκρί­\nσεως τοϋ Υπουργού δυνάμει της ύπο­ύποπαραγρά­\nφου (ii) της υποπαραγράφου (στ) της παραγράφου\n(2) του Κανονισμού 7'\n(ε) ό 'Ανώτερος Κυβερνητικός Χημικός, οί Κυβερνητικοί Χημι­\nκοί ή οιοσδήποτε έτερος χημικός εξουσιοδοτημένος ύπό του\nΥπουργού δυνάμει της υποπαραγράφου (η.) της παραγρά­\nφου (2) τοΰ Κανονισμού 7\"\n(στ) ό πλοιοκτήτης ή ό πλοίαρχος Κυπριακού πλοίου, ή ό κυβερ­\nνήτης Κυπριακού αεροσκάφους, δπερ δέν περιλαμβάνει έν\nτω πληρώματι αύτου ίατρόν\n(ζ), ό πλοίαρχος μή Κυπριακού πλοίου ή ό κυβερνήτης μη Κυ­\nπριακού αεροσκάφους Εν τινι λιμένι ή άερολιμένι της Δημο­\nκρατίας.\n(5) Διατακτικόν προμηιθευθεν διά τους σκοπούς της παραγρά­\nφου (2)— ­ ­\n(α) οσάκις, ώς αναφέρεται ανωτέρω, προμηθεύεται ύπό προ­\nϊσταμένης ή αναπληρώτριας προϊσταμένης αδελφής Νόσο­\n421 Κ.Δ.Π. 160/79\nκομείου η Ιδρύματος δέον όπως ύπογράφηται ύπό iorrpoD\nή οδοντιάτρου έργοδοτούμενου­ή οπτασχολούμενοα έν τω\nέν λόγω Νοσσκομείω ή Ί&ρύματΓ\n(β) οσάκις προμηθεύεται ύπό τοΰ πλοιάρχου μη Κυττριακοΰ\nπλοίου ή κυδερνήτου μη Κυπριακού αεροσκάφους, δέον\nδπως περιλαμβάνη δήλωσιν, ύπογεγραμμένην υπό του ίατρι­\nκοϋ λειτουργού του λιμένος ή αερολιμένος έν τή δικαιοδοσία\nτοΰ οποίου το πλοΐον ή αεροσκάφος ευρίσκεται, δτι ή ποσό­\nτης του προμηθευομένου φαρμάκου εΐναι ή ποσότης ή αναγ­\nκαίουσα διό τον έφοδιασμόν τοΰ πλοίου ή αεροσκάφους.\n(6) 'Οσάκις το πρόσωπον δπερ είναι ύπεύθυνον διά την παροχήν\nφαρμάκων κατόπιν συνταγής και διά την προμήθειαν φαρμάκων έν\nοίωδήποτε Νοσοκομείω ή Ίδρύματι, ως αναφέρεται ανωτέρω, προ­\nμηθεύει έλεγχόμενον φάρμακον &ί<; την άδελφήν fj άναπληρώτριαν\nάδελφήν την εκάστοτε ύπεύθυνον θαλάμου, χειρουργείου ή έτερου\nτμήματος τοΰ έν λόγω Νοσοκομείου, (έν τοις εφεξής έν τή παρούοτ)\nπαραγράφω αναφερομένης ως «ό παραλήπτης») οΰτος δέον δπως—\n(α) λαμβάνη έγγραφον διατακτικόν, ύπογεγραμμένον ύπό τοΰ\nπαραλήπτου δπερ καθορίζει την όλικήν προμηθευθησομένην\nποσότητα τοΰ φαρμάκου' και\n(β), επισημαίνει το διατακτιικόν κατά τοιούτον τρόπον ώστε νά\nφαίνηται δτι ή έν τω διατακτικώ εντολή έξετελέσθη,\nκαί πάν διατακτικόν ληφθέν διά τους σκοπούς τής παρούσης παρα­\nγράφου θά κατακρατήται έν τω φαρμακείω ένθα το φάρμακον έχει\nπρομηθευθή, άντίγραφον δε τοΰ διατακτικού ή σημεί­ωσις περί τούτου\nδέον νά κατακρατήται ή φυλάττηται ύπό τοΰ παραλήπτου.\n(7) Ουδέν των έν τω παρόντι Κανσνισμω διαλαμβανομένων θα\nέφαρμόζηται έν σχέσει προς τά φάρμακα τά καθοριζόμενα έν τω\nΠρώτω Πίνακι ή τα στελέχη τής μή κώνος τής ύπνοφόρου."},{"id":"law-narcotics-kdp79-art-11","lawId":"law-narcotics-kdp79","partId":"law-narcotics-kdp79-part-2","number":"αρ.11","titleGr":"Τύπος συνταγής","page":11,"notes":[{"level":1,"text":"τυπικές απαιτήσεις που πρέπει να πληροί μια συνταγή για ελεγχόμενο φάρμακο"},{"level":2,"text":"α) Η συνταγή πρέπει να είναι γραμμένη με μελάνη ή άλλως ανεξίτηλα"},{"level":2,"text":"υπογραφή του εκδίδοντος και να είναι χρονολογημένη"},{"level":2,"text":"β) Τα στοιχεία ταυτοποίησης ασθενούς και δοσολογίας πρέπει να είναι γραμμένα ιδιοχείρως από τον εκδίδοντα"},{"level":2,"text":"γ) Συνταγές οδοντιάτρου φέρουν ένδειξη «δι' οδοντιατρικήν θεραπείαν μόνον» — συνταγές κτηνιάτρου φέρουν «δια κτηνιατρικήν θεραπείαν μόνον»"},{"level":2,"text":"δ) Πρέπει να αναγράφονται όνομα και διεύθυνση του ασθενούς"},{"level":2,"text":"ε) Για σκευάσματα σε μονάδες δόσεως (δισκία, καψάκια): αναγράφονται τύπος, δύναμη, ολική ποσότητα και αριθμός μονάδων — αριθμητικώς ΚΑΙ ολογράφως"},{"level":2,"text":"Αν η συνταγή προβλέπει κατά δόσεις εκδοχή, πρέπει να περιλαμβάνει οδηγίες για ποσότητα και χρονικά διαστήματα κάθε δόσης"},{"level":2,"text":"στ) Οι δόσεις δεν δύνανται να εκτείνονται πέραν των 13 εβδομάδων του ενός μήνα από την ημερομηνία έκδοσης"},{"level":2,"text":"ζ) αναγράφει μόνο ένα φαρμακευτικό προϊόν στη συνταγή"}],"fullText":"11.— (1) Τηρουμένων των διατάξεων τοΰ παρόντος Κανονισμού Τύπος\nουδείς δύναται νά έκδίδη συνταγήν διαλαμ&άνουσαν έλεγχόμενον <ΛΛ»«*Υ%·\nφάρμακον, έτερον ή φάρμακον καθοριζόμενον έν τω Πρώτω Πίνακι,\nέκτος έάν ή συνταγή εΐναι σύμφωνος προς τάς ακολούθους προϋπο­\nθέσεις, ήτοι —\n(α), αυτή εΐναι γεγ ραμμένη διά μελάνης ή άλλως πως άνεξι­\nτήλως καί είναι υπογεγραμμένη ύπό τοΰ εκδίδοντος ταύτην\nπροσώπου διά τής συνήθους αύτοΰ ύιπογροοφής καί χρονο­\nλογημένη ύπ' οώτοΰ\"\n(β) καθ' ην έκτασιν αύτη καθορίζει τήν πληροφορίαν την άπαι­\nτουμένην ύπό των κάτωθι υποπαραγράφων (δ) καί (ε) ανα­\nγράφεται ιδιοχείρως ύπό τοΰ έκ&ίδοντος ταύτην προσώπου'\n(γ) φέρει έπ' αυτής, έάν έκδίδηται ύπό οδοντιάτρου, αναγε­\nγραμμένας τάς λέξεις «δι' όδοντιατρικήν θεραπείαν μόνον»\nκαί, έάν έκίδίδηται ύπό κτηνιάτρου τάς λέξεις «διά κτηνια­\nτρικήν θεραπείαν μόνον»'\n(δ) καθορίζει το δνομα καί την διεύθυνσιν ­τοΰ προσώπου διά\nτην θεραπείαν οδτινος αυτή εκδίδεται ή, έάν έκδίδηται ύπό\nκτηνιάτρου, τοΰ προσώπου εις το όποιον τό άναγεγραμμέ­\nνον φάρμακον θά παραδοθή'\n(ε) καθορίζει τήν ληφθησομένην δόσιν καί —\n(ί) έν περιπτώσει συνταγής διαλαμ&ανούσης έλεγχόμε­\nνον φάρμακον δπερ είναι σκεύασμα, τον τύπον καί,\nοσάκις τοΰτο είναι εφαρμόσιμο ν,, τήν δύναμιν τοΰ\nΚ.Δ.Π. 160/7? 422\nσκευάσματος, και είτε την όλικήν ποσότητα, αριθμη­\nτικώς και ολογράφως, τού σκευάσματος η του αρι­\nθμού, αριθμητικώς και ολογράφως, τών μονάδων δό­\nσεως, αναλόγως της περιιττώσεως'\n(ii) εν πάση έτερα περιπτώσει, την όλικήν ποσότητα, αρι­\nθμητικώς και ολογράφως, του προμηθευθησομένου\nελεγχομένου φαρμάκου\"\n(στ) έν τη περιπτώσει συνταγής δια της οποίας σκαπεϊται δπως\nή έν αύτη αναφερομένη· ποσότης του φαρμάκου μη έκδσθη\nεφ' άπαξ, αλλά κατά δόσεις, αυτή διαλαμβάνει οδηγίας\nκαθορίζουσας την ποσότητα και τά χρονικά διαστήματα διά\nτην έκδοσιν έκαστης δόσεως:\nΝοείται δτι αϊ τοιαΰται δόσεις δεν δύνανται νά επεκτείνονται πέ­\nραν τών δεκατριών εβδομάδων από της ημερομηνίας της εκδόσεως\nτης συνταγής.\n(2) Έν τη περιπτώσει συνταγής εκδιδομένης διά την θεροαιείαν\nασθενούς έν Κυβερνητικό Νοσοκομείω, ή Κυβερνητικοί Ίδρύματι ή\\\nέν οίωδήποτε έτέρω νοσοκομείω­ ή ίδρύματι άττερ ήθελε τύχει της\nεγκρίσεως τοΰ Υπουργού δυνάμει της ύπο­ύπ:οπαραγράφου (ii) της\nυποπαραγράφου (στ) τής παραγράφου (2) του Κανονισμού 7, ή\nύ­ιτχπταράγραφος (δ) τής παραγράφου (ί) τού παρόντος Κανονισμού\nδέον νά λογίζηται τηρηθεϊσα έάν ή συνταγή άναγράφηται έπί τού\nδελτίου τής κλίνης τού ασθενούς ή τού δελτίου τού ιστορικού τού\nασθενούς και έν πάση τοιαύτη περιπτώσει τά αρχικά ψηφία τού έκιδί­\nδοντος την συνταγήν προσώπου λογίζονται ώς επαρκής υπογραφή\nδιά τους σκοπούς τής υποπαραγράφου (α) τής παραγράφου (·1) τού\nπαρόντος Κανονισμού.\nΠρόνοια 12.— (1)' Ουδείς δύναται νά προμηιθεύη έλεγχόμενον φάρμακον,\nόσον άφορα έτερον ή φάρμακον καθοριζόμενον έν τω Πρώτω Πίνακα,, βάσει συν­\nτήνπρομή­ ταγής—\nθειαν βάσει,\nσυνταγής.. (α) έκτος έάν ή συνταγή είναι σύμφωνος προς τάς διατάξεις\nτού Κανονισμού Π '\n(β) έκτος έάν ή έν τη συνταγή καθοριζομένη διεύθυνσις τού\nεκδίδοντος ταύτη ν προσώπου είναι ή διεύθυνσις έν τη Δημο­^\nκρατία'\n• (γ) εκτός έάν ούτος γνωρίζη καλώς την ύπογραφήν τού προσώ­\nπου υπό τού οποίου αύτη: φέρεται εκδοθείσα και ovbkvcc\nλόγον έχει νά ύποθέση δτι αύτη δεν είναι γνη,σία ή προέβη\nεις ευλόγως επαρκή διαβήματα ώστε νά ίκανοποιηιθη δτι\nαύτη είναι γνήσια'\n(δ) προ τής έν τη συνταγή αναγραφομένης ημερομηνίας*\n(ε), βραδύτερον τών δεκατριών εβδομάδων άπό τής ημερομηνίας\nεκδόσεως τής συνταγής.\n(2) Ύπό την αΐρεσιν τής παραγράφου (3), πάν πρόσωπον εκτε­\nλούν συνταγήν διαλαμβάνουσαν έλεγχόμενον φάρμακον, έτερον ή\nΦάρμακον καθοριζόμενον έν τω Πρώτω Πίνακι, οφείλει κατά τόν\nχρόνον τής εκτελέσεως ταύτης νά σημειοΐ έττ' αυτής την ήμερομηνύχν\nκαθ* ή­ν αύτη έξετελέσθη και οφείλει νά κράτη τοώτην έν τοις ύπο­\nστατικοΐς ένθα αύτη έξετελέσθη.\n(3)', Έν τη περιπτώσει συνταγής αναφερομένης εις έλεγχόμενον\nφάρμακον, έτερον ή φάρμακον καθοριζόμενον έν τω Πρώτω Πίνακι,\nήτις διαλαμβάνει οδηγίας δτι καθοριζόμενοι δόσεις τής ολικής ποσό­\nτητος τού φαρμάκου δύνανται νά έκδίδωνται κατά καθοριζόμενα\n423 Κ.Δ.Π.: 160/79\n; χρονικά διαστήματα, το εκτελούν την συνταγή ν πρόσωπον δέν θά\nπρομηθεύη το φάρμακο ν κατ' άλλον τρόπον εΙμή συμφώνως προς τάς\nεν λόγω οδηγίας και ή άνω παράγραφος (2) θά ίσχύη ώς έάν αντί\nτών λέξεον «κατά τον χρόνο ν της εκτελέσεως ταύτης» ύφίσταντο αϊ\nλέξεις «έν έκαστη περιπτώσει καθ' ην δόσις τις δίδεται»."},{"id":"law-narcotics-kdp79-art-12","lawId":"law-narcotics-kdp79","partId":"law-narcotics-kdp79-part-2","number":"αρ.12","titleGr":"Πρόνοιες όσον αφορά την προμήθεια βάσει συνταγής","page":12,"notes":[{"level":1,"text":"καθορίζει τις υποχρεώσεις του φαρμακοποιού ή προμηθευτή κατά την εκτέλεση συνταγής ελεγχομένου φαρμάκου — δηλαδή τι πρέπει να ελέγχει και τι πρέπει να κάνει κατά και μετά την προμήθεια"},{"level":1,"text":"ΕΛΕΓΧΟΣ σωρευτικών προϋποθέσεων:"},{"level":2,"text":"α) Τυπική συμμόρφωση (Αρ.11)"},{"level":2,"text":"β) Διεύθυνση εκδίδοντος εντός Δημοκρατίας"},{"level":2,"text":"γ) Γνησιότητα υπογραφής"},{"level":2,"text":"δ) Εντός ημερομηνίας"},{"level":2,"text":"ε) Εντός 13 εβδομάδων  τριών μηνών από έκδοση"},{"level":1,"text":"Σημείωση ημερομηνίας εκτέλεσης στη συνταγή"},{"level":1,"text":"Φύλαξη συνταγής στα υποστατικά"}],"fullText":null},{"id":"law-narcotics-kdp79-art-13","lawId":"law-narcotics-kdp79","partId":"law-narcotics-kdp79-part-2","number":"αρ.13","titleGr":"Τήρηση βιβλίων","page":13,"notes":[{"level":1,"text":"ελεγχόμενα φάρμακα του Δευτέρου ή Τετάρτου Πίνακα"},{"level":1,"text":"Κάθε κίνηση φαρμάκου — είσοδος (παραλαβή) και έξοδος (χορήγηση) — καταγράφεται χρονολογικά στον τύπο του Πέμπτου Πίνακα (σ.21)"},{"level":1,"text":"Κάθε φάρμακο (μαζί με τα άλατα και σκευάσματά του) πρέπει να έχει χωριστό βιβλίο ή χωριστή μερίδα"},{"level":1,"text":"Ακόμα και το ίδιο φάρμακο σε διαφορετική δύναμη ή περιεκτικότητα απαιτεί χωριστή καταχώριση"},{"level":1,"text":"Κάθε 31η Δεκεμβρίου υποχρεούνται να ετοιμάζουν ετήσιο ισολογισμό που να αποδεικνύει τη διαφορά μεταξύ παραληφθέντων και χορηγηθέντων φαρμάκων"}],"fullText":"13.—(1) 'Υπό την αΐρεσιν του Κανονισμού 15 και της παραγράφου Τήρησ'ζ\n(3) του παρόντος Κανονισμού, παν πρόσωπον έξουσιοδοτη'μένον δυ­ βιβλίων·\nνάμει τοΰ Κανονισμού 4 ή 7 νά προμηθεύη οιονδήποτε φάρμακον\nκαθοριζόμενον έν τω Δευτέρω ή Τετάρτω Πίνακι οφείλει νά συμμορ­\nφούται προς τάς ακολούθους διατάξεις, ήτοι —\n(α) να τηρή, συμφώνως προς τάς διατάξεις τοΰ παρόντος Κανο­\nνισμού και του Κανονισμού 14, βιδλίον καΐ καταχωρίζη έν\nαύτώ κατά χρονολογικήν τάξιν και έν τω τύπω τω καθορι­\nζομένω έν τω Μέρει Ι ή 11 τοΰ Πέμπτου Πίνακος, αναλόγως\nτης περιπτώσεως, λεπτομέρειας έκαστης ποσότητος φαρμά­\nκου καθοριζομένου έν τω Δευτέρω ή Τετάρτω Πίνακι ην\nοδτος ήθελε προμηθευθή και πάσης ποσότητος τοιούτου\nφαρμάκου ήν οδτος ήθελε προμηθεύσει (είτε διά χορηγήσεως\nείτε άλλως πως) εις πρόσωπα εντός ή έκτος της Δημοκρα­\nτίας'\n(β) νά ποιήται χρήσιν χωριστού δ.ι&λίου ή χωριστής μερίδας τοΰ\nβιβλίου δι* έγγραφάς γενομένας έν σχέσει προς έκαστη ν\nτάξιν φαρμάκων, και £καστον τών φαρμάκων των καθοριζο­\nμένων έν ταΐς παραγράφοις 1,3 και 6 τοΰ Δευτέρου Πίνακος\nκαι ταΐς παραγράφοις 1 και 3 τοΰ Τετάρτου Πίνακος όμοΰ\nμετά τών αλάτων αυτών και πάν σκεύασμα ή έτερον προϊόν\nπεριέχον τούτο ή οιονδήποτε τών αλάτων αύτου θά λογίζη­\nται ώς χωριστή τάξις'\n(γ) νά ποιήται χρήσιν χωριστού βιβλίου ή χωριστής μερίδος\nτοΰ 6ιδλίου έν σχέσει προς διάφορα φάρμακα ή περιεκτικό­\nτητα φαρμάκων ή σκευασμάτων.\n(2)| Πάς εξουσιοδοτημένος πωλητής δηλητηρίων ή τταραγζογός\nοφείλει δπως —\n(α) επιπροσθέτως, καταχωρίζη έν τω μνημονευομένω έν τή άνω\nπαραγράφω (1) 6αδλίω έκάστην ποσότητα φαρμάκου, ανα­\nφερομένου έν τη ύποπαραγράφω (β) τής ώς είρηται παρα­\nγράφου (1), χρησιμοποιουμένου ύπ* αύτοΰ διά τήν κατα­\nσκευήν οιουδήποτε σκευάσματος ή τήν έκτέλεσιν συνταγής\nανεξαρτήτως έάν το ούτω παραχθέν ή κατασκευασθέν σκεύ­\nασμα έμπίπτη εντός τών διατάξεων τοΰ Πρώτου ή Τετάρτου\nΠίνακος'\n(β) προσθετή τήν 31ην Δεκεμβρίου, έκαστου έτους τάς μέχρι\nτής έν λόγω ημερομηνίας γενομένας έγγραφάς και δι* Ισο­\nλογισμού γενομένου έν τω μνη.μονευομένω έν τή άνω παρα­\nγράφω (1) 6ιβλίω καταδεικνύει τήν διαφοράν ήτις ήθελεν\nυφίσταται μεταξύ τών φαρμάκων ή οκευασμάτων άτινα\nοΰτος ήθελε προμηθευθη και τών φαρμάκων ή σκευασμά­\nτων άτινα ήθελε παράσχει,\n(3)i Αϊ διατάξεις του παρόντος Κανονισμού δέν τυγχάνουσιν εφαρ­\nμογής έν σχέσει προς οιονδήποτε πρόσωπον εξουσιοδοτημένο ν δυνά­\nμει τοΰ Κανονισμού 4 νά προμηθεύη οιονδήποτε φάρμακον, οσάκις\nή άδεια ούτω επιτάσσει."},{"id":"law-narcotics-kdp79-art-14","lawId":"law-narcotics-kdp79","partId":"law-narcotics-kdp79-part-2","number":"αρ.14","titleGr":"Διατάξεις σχετικά με την τήρηση βιβλίων","page":13,"notes":[{"level":1,"text":"Κάθε σελίδα του βιβλίου πρέπει να έχει ξεκάθαρη επικεφαλίδα που να αναφέρει το φάρμακο στο οποίο αφορούν οι εγγραφές"},{"level":1,"text":"Κάθε εγγραφή γίνεται την ίδια ημέρα της κίνησης του φαρμάκου"},{"level":1,"text":"Όλες οι εγγραφές γίνονται με μελάνη ή άλλως ανεξίτηλα"},{"level":1,"text":"Απαγορεύεται απολύτως η ακύρωση, διαγραφή ή αλλοίωση οποιασδήποτε εγγραφής"},{"level":1,"text":"Τηρείται χωριστό βιβλίο για κάθε υποστατικό"},{"level":1,"text":"Κάθε βιβλίο φυλάσσεται στα υποστατικά στα οποία αναφέρεται"}],"fullText":"14. Πάς όστις υποχρεούται νά τηρή 6ιβλία δυνάμει τοΰ Κανονισμού 6ξ\nΔιαιΓ ει<Ζ\n13 οφείλει νά συμμορφοΰται προς τάς κάτωθι διατάξεις, ήτοι— σχετικώς\nitpo<;rrf)Y)\nτήρήσΐΜ\nβιβλίων.\n!C/Ln..l'6fr/79- 424\n(α) Τά φάρμοτκα ή σκευάσματα εις τά\" όποια αναφέρονται ~αι\nέγγραφαί έκαστης σελίδος δέον να καθορίζωνται εις την\nκορυφήν της τοιαύτης σελίδος*\n(β) έκαστη έγγραφη; δυνάμει του Κανονισμού U γενομένη .έν\nr\nτω βιβλίω δέον δ­πως­ διενεργήται κατά την ήμέραν καθ* ήν\nπαραλαμβάνεται τό φάρμακον ή, αναλόγως της περιπτώ­\nΤ\nσεως, καθ* ην λαμβάνει χώραν ή. πράξις έν σχέσει προς την\nπρομήθειαν του φαρμάκου ύπό του προσώπου δπερ οφείλει να\nδιενεργήση την έγγραφήν ή,; εάν τούτο δεν είναι ευλόγως\nπρακτικών, κατά την αμέσως, έπο μένη ν ήμέραν\n(γ) ουδεμία άκύρωσις, διαγραφή ή άλλοίωσις οιασδήποτε τοι­\nαύτης έγγραφης θά διενεργήται, οιαδήποτε δέ διόρθωσις τοι­\nαύτης έγγραφης θά διενεργήται μόνον διά σημειώσεως έν\nτω περιθωρίω ή δι' ύποσημειώσεως είς τήν οποίαν θά άνα­\nγράφηται και ή ημερομηνία .καθ·' ην ή διόρθωσις έγένετο'\n(δ) πάσα τοιαύτη.έγγραφη και πάσα διόρθωσις τοιαύτης έγγρα­\nφης γίνονται διά μελάνης ή άλλως πως άνεξιτήλως'\n(ε) το βιβλίον δέν 0ά χρησιμοποιήται δι* οιονδήποτε έτερον\nσκοπόν ειμή διά τους σκοπούς των παρόντων Κανονισμών\n(στ); το πρόσωπον δπερ ούτω οφείλει νά τηρή βιβλίον οφείλει\nδπως, τη εντολή, τού Υπουργού­ή­οιουδήποτε έτερου παρ'\nαυτού εξουσιοδοτημένου προσώπου—\n(i) παρέχη τοιαύτας λεπτομέρειας ως ήθελον ζητη,θή\nπαρ* αύτοΰ έν σχέσει προς τήν λήψιν ή προμήθειαν ύπ'\nαυτού οιουδήποτε φαρμάκου καθοριζομένου έν τω\nΔευτέρω ή Τετάρτω Πίνακι ή έν σχέσει προς οιονδή­\nποτε απόθεμα τοιούτων φαρμάκων ­ έν τη κατοχή\nαυτού'\n(U), προσάγη διά τους σκοπούς διαπιστώσεως των τοιού­\nτων λεπτομερειών οιονδήποτε απόθεμα τοιούτων φαρ­\nμάκων έν τη κατοχή αύτοΰ'\n(iii) προσάγη. το βιβλίον και. τοιαύτα έτερα βιβλία ή έγ­\nγραφα έν τη κατοχή οώτού αναφερόμενα, είς οιασδή­\nποτε δοσοληψίας διά φάρμακα καθοριζόμενα έν τω\nΔευτέρω ή Τετάρτω Πίνακι, ώς ήθελε ζητηθή παρ*\nαύτοΰ'\n(ζ) τηρή χωριστόν βιβλίον έν σχέσει προς £καστον ύποστατικόν\nένθα το πρόσωπον, δπερ εΐναι ύπόχρεον δπως τηρή τό βι­\nβλίον, διεξάγη τήν έργασίοα; ή τό επάγγελμα του αλλά ύπό\nτήν αΐρεσιν δτι ουχί πέραν τοΰ ενός βιβλίου θά τηρήται κατά\nτον αυτόν χρόνον έν σχέσει προς έκαστη ν τάξιν φάρμακον\nάναφορικώς προς τήν οποίαν ούτος οφείλει νά τηρή χωρι­\nστόν βιβλίον έν τούτοις, τή έγκρίσει τοΰ Υπουργού, είναι\nδυνατή ή τήρησις χωριστού βιβλίου δι' έ*ν εκαστον τμήμα\nτης 6π* αυτού ενασκούμενης εργασίας'\n(η), φυλάττη έκαστον βιβλίον εις τό όποιον γίνονται γενικώς αϊ\nάναγραφαί. είς τά υποστατικά­εις τά όποια τούτο αναφέ­\nρεται."},{"id":"law-narcotics-kdp79-art-15","lawId":"law-narcotics-kdp79","partId":"law-narcotics-kdp79-part-2","number":"αρ.15","titleGr":"Τήρηση αρχείων σε ειδικές περιπτώσεις","page":14,"notes":[{"level":1,"text":"Για φάρμακα Δευτέρου Πίνακα που χορηγούνται σε μέλη πληρώματος Κυπριακού πλοίου"},{"level":1,"text":"αρκεί εγγραφή στο επίσημο ημερολόγιο ή έκθεση υπογεγραμμένη από πλοίαρχο"}],"fullText":"15. \"Οσάκις φάρμακον καθοριζόμενον έν τω Δευτέρω Πίνακι παρέ­\nΤήρησις\nαρχείων είς χεται συμφώνως προς τήν ύποπαράγραφον (i) της, παραγράφου (5)\nείδοκάς* του Κανονισμού 7 είς μέλος τού πληρώματος Κυπριακού πλοίου, ή\nπεριπτώσεις. έγγραφη έν τω έιπισήμω ήμερολογίω τού πλοίου, τω άπαιτουμένω\nδπως τηρήται δυνάμει των περί 'Εμπορικής Ναυτιλίας (Πλοίαρχοι\nκαΐ Ναυτικοί) Νόμων τοΰ 1963 εως 1976, ή έν τή περιπτώσει πλοίου\n46τοϋ1963\nμή υποχρεωμένου νά τηρή τοιούτον έπίσημον ήμερολόγιον, εκθεσις\n33TO0 1965\n69 τοΰ 1968\n25 τοΰ 1969\n24το0 1976.\n425 Κ.Δ.Π. 160/79\nυπογεγραμμένη ύπό του πλοιάρχου, ανεξαρτήτως οιουδήποτε έν τοις\nπαροασι Κανονισμοΐς διαλαμβανομένου, λογίζεται ως επαρκής μνεία\nδια τήν προμήθειαν έάν ή καταχώρησις ή έκθεσις καθορίζη το παρα­\nσχεθέν φάρμακον καί, έν τη περιπτώσει εκθέσεως, παραδίδεται ως\nοίον τε τάχιστα εις τον ύπεύθυνον τοΰ λιμένος."},{"id":"law-narcotics-kdp79-art-16","lawId":"law-narcotics-kdp79","partId":"law-narcotics-kdp79-part-2","number":"αρ.16","titleGr":"Φύλαξη βιβλίων και εγγραφών","page":15,"notes":[{"level":1,"text":"Βιβλία/Μητρώα  2 χρόνια"},{"level":1,"text":"Διατακτικά/Διαταγές/Συνταγές  2 χρόνια από την τελευταία παράδοση"},{"level":1,"text":"τα μητρώα και βιβλία δύναται να τηρούνται σε ηλεκτρονική μορφή"},{"level":1,"text":"Παραγωγοί/χονδροπωλητές τηρούν έγγραφα και για εισερχόμενες και για εξερχόμενες ποσότητες"},{"level":1,"text":"Λιανοπωλητές τηρούν έγγραφα μόνο για εισερχόμενες ποσότητες"},{"level":1,"text":"Αρκούν τιμολόγια ή παρόμοια έγγραφα — δεν απαιτείται χωριστό βιβλίο ή χρονολογική καταχώριση"},{"level":1,"text":"Περίοδος φύλαξης 2 χρόνια"}],"fullText":"16.—(1) \"Απαντα τά μητρώα καί βιβλία τα τηρούμενα συμφώνως φύλαξις\nπρος τον Κανονισμόν 13 δέον νά φυλάττωνται διά περίοδον δύο ετών g^^^i\nαπό της ημερομηνίας άφ' ής έγένετο έν αύτοϊς ή τελευταία άνα­ ίχέρω?.*.\nγραφή. έγγραφων.\n(2) Παν διατακτυκόν, διαταγή ή συνταγή έπί τη δάσει της όποιας\nέλεγχόμενον φάρμακον προμηθεύεται συμφώνως προς τους παθόν­\nτας Κανονισμούς θα φυλάττηται διά περίοδον δύο ετών από της\nημερομηνίας άφ* ής έγένετο ή τελευταία παράδοσις."},{"id":"law-narcotics-kdp79-art-18","lawId":"law-narcotics-kdp79","partId":"law-narcotics-kdp79-part-3","number":"αρ.18","titleGr":"Γνωστοποίηση των προσώπων εθισμένων σε φάρμακα","page":15,"notes":[{"level":1,"text":"υποχρέωση γνωστοποίησης στις αρχές όταν ιατρός θεραπεύει ασθενή που είναι εξαρτημένος από φάρμακο του Έκτου Πίνακα"},{"level":1,"text":"Εντός 7 ημερών από την πρώτη ιατρική επίσκεψη οφείλει να παράσχει έγγραφη γνωστοποίηση στον Ιατρικό Λειτουργό οριζόμενο από τον Υπουργό Υγείας"},{"level":2,"text":"Όνομα, διεύθυνση, φύλο, ημερομηνία γέννησης, αριθμός ταυτότητας, Ημερομηνία πρώτης ιατρικής επίσκεψης, όνομα σχετικού φαρμάκου"},{"level":1,"text":"Εξαιρέσεις  θεραπεία οργανικής ασθένειας ή τραύματος, ήδη γνωστοποιήθηκε εντός 12 μηνών"}],"fullText":"18.— 0) Τηρούμενης της παραγράφου (2), πάς ιατρός δστις πάρα:­ Γχ­ωστσποί­\nκολουθεΐ ιατρικώς οιονδήποτε πρόσωπον δπερ θεωρεί ή έχει εϋλογον ηοις.τών,\nαίτίαν νά θεωρη δτι έχει έθισθη είς οιονδήποτε έλεγχόμενον φάρμα­ ^θι<*μένων\nκον καθοριζόμενον έν τώ \"Εκτω Πίνακι, οφείλει όπως, εντός επτά f.Lli.^P^*\n, *~ , , ~ ι \\ ι ι ί , ■ » ­. μένα φάρμακα\nήμερων απο της πρώτης επισκέψεως, παράσχη εγγράφως προς ίατρι­ ­προσώπων.\nκόν λειτουργόν οριζόμενο ν υπό τοΰ Υπουργού Υγείας τοιαύτας\nέκ τών ακολούθων λεπτομερειών έν σχέσει προς το τοιοΰτο πρόσω­\nπον ώς ήθελεν είναι ­γνωστά! είς τον ίατρόν, ήτοι τό δνομα,τήν διεύ­\nθυνσιν, τό φΰλον, τήν ­ήμερο μη νίαν γεννήσεως ­καί τον αριθμόν ταυ­\nτότητος τοΰ ώς ^είρηται ­προσώπου, τήν ήμερομηνίάν της ιατρικής\nεπισκέψεως καί τό όνομα του σχετικού φαρμάκου. '\n(2) Δέν υφίσταται ύποχρέωσις προς συμμόρφωσιν προς τάς ^δια­\nτάξεις της παραγράφου (1) είς ττερίπτωσιν­καθ'­ήιν—\n(α) ό ιατρός \"εΐναι της γνώμη,ς,'διαμορφωθείσης καλή τη πίστει,\nδτι ή συνεχής χορήγησις τοΰ σχετικού ελεγχομένου <{>αρμά­\nκου απαιτείται διό σκοπούς θεραπείας όργοη/ικής ασθενείας\nή τραύματος* ή\n(β) αί λεπτομέρειαι αΐτινες θά έδει να παρασχεθώσι δυνάμει\nτων διατάξεων της παραγράφου (1) έχουσι, εντός δώδεκα\nμηνών προ της. πρώτης ιατρικής επισκέψεως, παρασχεθή\nσυμφωνίας προς τάς εν λόγω διατάξεις—\n(i) υπό του ιατρού\" ή\n(ii) εις­περίπτωσιν ιατρικής παρακολουθήσεως έκ μέρους\nέτερου ιατρού, είτε έπι πληρωμή είτε άλλως, ύπό του\nέτερου τοιούτου ίατροΰ\" ή\n(iii) έάν εις την περίπτωσιν ιατρικής παρακολουθήσεως έν\nΚυδερνητικώ Νοσοκομείω ή Ιδρύματι, ΰπό ιατρού\nμέλους του προσωπικού του έν λόγω Νοσοκομείου\nή 'Ιδρύματος.\nΠρομήθεια 19. Ουδείς ιατρός θά χορηγή ή παρέχη εις πρόσωπον δπέρ θεωρεί\nxcd χορήγη­ ή έχει ευλογον αίτίαν νά θεωρή δτι έχει έθισθή εις οιονδήποτε έλεγ­\nσις έλεγχσμέ­ χόμενον φάρμακον καθοριζόμενον έν τω \"Εκτω Πίνακι, ή θα έξουσι­\n\\ιον φαρμα­\nοδοτή την χορήγησιν ή προμήθειαν εις τό τοιούτο πρόσωπον οιουδή­\nκώνεις\nπρόσωπα ποτε τοιούτου φαρμάκου, ή θά παρέχη διά συνταγής ή άλλως εις\nείθυσμένο) τό τοιούτο πρόσωπον οιονδήποτε τοιούτο φάρμακον, ειμή δυνάμει\nεις αυτά.\nκαι συμφώνως προς τους δ ρους αδείας εκδοθείσης ύπό του Υπουργού.\n­ΜΕΡΟΣ IV\nΕΚΘΕΣΙΣ ΕΙΣΑΓΩΓΗΣ ΨΥΧΟΤΡΟΠΩΝ ΟΥΣΙΩΝ"},{"id":"law-narcotics-kdp79-art-19","lawId":"law-narcotics-kdp79","partId":"law-narcotics-kdp79-part-3","number":"αρ.19","titleGr":"Προμήθεια και χορήγηση των ελεγχόμενων φαρμάκων σε πρόσωπα εθισμένα σε αυτά","page":16,"notes":[{"level":1,"text":"απόλυτη απαγόρευση χορήγησης φαρμάκων του Έκτου Πίνακα σε πρόσωπα που ο ιατρός θεωρεί ή έχει εύλογη αιτία να θεωρεί ότι είναι εξαρτημένα — εκτός αν έχει ειδική άδεια του Υπουργού"}],"fullText":null},{"id":"law-narcotics-kdp79-art-20","lawId":"law-narcotics-kdp79","partId":"law-narcotics-kdp79-part-4-iv","number":"αρ.20","titleGr":"Έκθεση εισαγωγής φαρμάκων που αναφέρονται στον Έβδομο Πίνακα","page":16,"notes":[{"level":1,"text":"υποχρέωση υποβολής έκθεσης για οποιοδήποτε πρόσωπο εκτελεί εισαγωγή ουσιών που αναφέρονται στον Έβδομο Πίνακα (εντός 7 ημερών)"},{"level":1,"text":"Τύπος της έκθεσης καθορίζεται στον Όγδοο Πίνακα"}],"fullText":"20. Πάν πρόσωπον οφείλει, εντός επτά ήμερων άπό τής ημερομη­\n\"Εκθεσις\nεισαγωγής νίας έκτελωνίσεως οιωνδήποτε ουσιών καθοριζομένων ή αναφερομέ­\nφάρμακων νων έν τω Έβδόμω Πίνακι, νά συμπληροΐ και παραδίδη εις τον Άρ­\nαναφερομένων χιφαρμακ οποίον του Τμήματος 'Ιατρικών Υπηρεσιών έκθεσιν έν\nέντω Όγδόω\nτω τύπω τω έκτιθειμένω έν τω Όγδόω Πίνακι, παρέχον τάς έν αύτώ\nflivCBKC^\nδιαλαμδανομένας λεπτομέρειας.\nΜΕΡΟΣ V\nΠΟΙΚΙΛΑΙ ΔΙΑΤΑΞΕΙΣ\nΦύλαξις *κα1 21.—(1) Πάν φάρμακον, καθοριζόμενον έν τω Δευτέρω ή Τετάρτω\nκαταστροφή Πίνακι, δπερ ευρίσκεται ύπό την φύλαξιν προσώπου εξουσιοδοτη­\nελεγχομένων μένου δυνάμει των παρόντων Κανονισμών δπως έχη τούτο έν τη\nφαρμάκων.\nκατοχή του, δέον δπως φυλάττηται ύπ' αύτου έν ασφάλεια και εντός\nκλειδωμένου κιβωτίου, ερμαρίου ή έτερου παρομοίου σκεύους, δπερ.\nδέν δύναται νά άνοιχθη ειμή παρ' αύτου ή παρ' έτερου προσώπου\nεξουσιοδοτημένου δυνάμει τών παρόντων Κανονισμών δπως έχη τό\nτοιούτο φάρμακον έν τη κατοχή του.\n(2) Ουδέν πρόσωπον πάρα του όποιου απαιτείται, δυνάμει τών\nπαρόντων Κανονισμών ή δυνάμει οιουδήποτε δρου αδείας τελούσης\nέν ίσχύϊ, νά τηρή άρχεια άφορώντα εις φάρμακον .καθοριζόμενον\nέν τω Δευτέρω ή Τετάρτω Πίνακι θά καταστρέψη τοιούτο φάρμακον\nή θά μεριμνά διά τή ν καταστροφή ν τούτου έκτος τη παρουσία και\nσυμφωνως προς τάς οδηγίας προσώπου εξουσιοδοτημένου (είτε προ­\nσωπικώς είτε ώς μέλους τάξεως) διά τους σκοπούς τής παρούσης\nπαροΓ/ράφου ύπό του Υπουργού (έ,ν τοις εφεξής έν τω παρόντι Κανο­\nνισμώ αναφερομένου ώς «έξουσιοδοτημένον πρόσωπον»).\n(3) Παν έξουσιοδοτημένον πρόσωπον δύναται, διά τους σκοπούς\nαναλύσεως, νά λά&η δείγμα οιουδήποτε φαρμάκου, καθοριζομένου\nέν τω Δευτέρω ή Τετάρτω Πίναχι δπερ πρόκειται νά καταστραφή.\n(4) Όσάκις φάρμακον τι κ<χθοριζόμενον έν τω Δευτέρω ή Τετάρτω\nΠίνακι καταστρέφεται συμφώνως προς τήν παράγραφον (2) ύπό ή\nτή υποδείξει προσώπου παρά του οποίου απαιτείται ύπό τών παρόν­\n427 Κ.Δ.Π. 160/79\nτων Κανονισμών ή ύφ° οιουδήποτε δρου αδείας τελούσης έν ΙσχύΙ να\nτηρή σημειώσεις έν σχέσει ­προς την λήψιν ή προμήθειαν του έν\nλόγω φαρμάκου, αί τοιαυται σημειώσεις θα διαλαμβάνουν λεπτο­\nμέρειας της ημερομηνίας καταστροφής και της καταστραφείσης\nποσότητος καΐ θα ύπογράφωνται ύπό του εξουσιοδοτημένου προσώ­\nπου επί παρουσία του οποίου το φάρμακον καταστρέφεται.\n(5) 'Οσάκις οιοσδήποτε πλοιοκτήτης ή πλοίαρχος Κυπριακού\nπλοίου, ή κυβερνήτης Κυπριακού αεροσκάφους, εχη έν τη κατοχή\nτου φάρμακον καθοριζόμενον έν τω Δευτέρω Πινάκι, δπερ οδτος δέν\nχρειάζεται περαιτέρω, δέν θα καταστρέφη ή μεριμνά δπως το φάρ­\nμακον καταστραφη άλλα θά διαθέτη τούτο προς αστυφύλακα ή είς\nπρόσωπον δπερ δύναται νομίμως να διάθεση τούτο."},{"id":"law-narcotics-kdp79-art-21","lawId":"law-narcotics-kdp79","partId":"law-narcotics-kdp79-part-5-v","number":"αρ.21","titleGr":"Φύλαξη και καταστροφή ελεγχόμενων φαρμάκων","page":16,"notes":[{"level":1,"text":"κανόνες για την ασφαλή φύλαξη και την καταστροφή ελεγχόμενων φαρμάκων Δευτέρου και Τετάρτου Πίνακα"},{"level":1,"text":"φυλάσσονται κλειδωμένα, πρόσβαση μόνο από εξουσιοδοτημένους"},{"level":1,"text":"καταστροφή υπό επίβλεψη του εξουσιοδοτημένου προσώπου"},{"level":1,"text":"σημειώνεται ημερομηνία και ποσότητα που καταστράφηκε με υπογραφή εξουσιοδοτημένου προσώπου"},{"level":1,"text":"πλοιοκτήτης διαθέτει το φάρμακο (Δευτέρου Πίνακα) στον αστυφύλακα για καταστροφή"}],"fullText":null},{"id":"law-narcotics-kdp79-art-22","lawId":"law-narcotics-kdp79","partId":"law-narcotics-kdp79-part-5-v","number":"αρ.22","titleGr":"Επισήμανση","page":17,"notes":[{"level":1,"text":"αν είναι καθαρή ουσία (δεν είναι σκεύασμα)  αναγράφεται η ποσότητα"},{"level":1,"text":"αν είναι σκεύασμα:"},{"level":2,"text":"δισκία, καψάκια ή άλλη μονάδα δόσεως  ποσότητα ανά μονάδα δόσης (π.χ. ανά δισκίο) και συνολικός αριθμός μονάδων"},{"level":2,"text":"αν είναι σιρόπι, διάλυμα κλπ.  ολική ποσότητα σκευάσματος και ποσοστό (%) κάθε συστατικού"},{"level":1,"text":"εξαιρέσεις  Πρώτος Πίνακας, προμήθεια βάση συνταγής (ισχύουν αρ. 11 και 12)"}],"fullText":"22.—(1) \"Υπό την αΐρεσιν της παραγράφου (2), ουδέν πρόσωπον Έπισήμσινισις\nθά προμηθεύη έλεγχόμενον φάρμακον ειμή έν φιάλη, δέματι ή έτέρω ?^ον,βκ\nκαλύμματι δπερ είναι ευκρινώς σεσημασμένον— δοχείου,\n(α) έν τη περιπτώσει ελεγχομένου φαρμάκου έτερου ή σκευά­\nσματος, διά της ποσότητος του έν αύτώ περιεχομένου φαρ­\nμάκου'\n(β) έν τη περιπτώσει ελεγχομένου φαρμάκου δπερ είναι σκεύ­\nασμα —\n(i) κατασκευασθέν εις δισκία, καψάκια ή έτέραν μονάδα\nδόσεων, διά της ποσότητος εκάστου συστατικού (δν­\nτος ελεγχομένου φαρμάκου) τοΰ σκευάσματος έν έκα­\nστη μονάδι δόσεως και διά τοΟ άριθμοΟ των μονάδων\nδόσεων έν τη φιάλη, δέματι ή έτέρω καλύμματι*\n(ii) μη κατασκευασθέν ώς ανωτέρω αναφέρεται, διά της\nολικής ποσότητος τοΰ σκευάσματος έν τη φιάλη, δέ­\nματι ή έτέρω καλύμματι καΐ της εκατοστιαίας ανα­\nλογίας εκάστου των συνθετικών αύτου δπερ είναι\nέλεγχόμενον φάρμακον.\n(2) Ουδέν τών έν τω παρόντι Κανονισμώ διαλαμβανομένων θά\nίσχύη έν σχέσει προς τά έν τω Πρώτω Πίνακι καθοριζόμενα φάρμακα\nή τά στελέχη της μήκώνος της ύπνοφόρου ή έν σχέσει προς την προ­\nμήθειαν ελεγχομένου φαρμάκου δυνάμει συνταγής Ιατρού, οδοντι­\nάτρου ή κτηνιάτρου."},{"id":"law-narcotics-kdp19-art-12","lawId":"law-narcotics-kdp19","partId":"law-narcotics-kdp19-part-4-22","number":"αρ.12","titleGr":"Τροποποίηση του","page":null,"notes":[{"level":1,"text":"στην υποπαράγραφο ε << δεκατριών εβδομάδων>> αντικαθίσταται με <<τριών μηνών>>"}],"fullText":null},{"id":"law-narcotics-kdp19-art-16","lawId":"law-narcotics-kdp19","partId":"law-narcotics-kdp19-part-4-22","number":"αρ.16","titleGr":"Τροποποίηση του","page":null,"notes":[{"level":1,"text":"προστίθεται τελευταία παράγραφος 3  τα μητρώα και τα βιβλία δύναται να τηρούνται και σε ηλεκτρονική μορφή"}],"fullText":null}]};

/* =========================================================
   STATE (persisted)
   ========================================================= */
const STORAGE_KEY = "cy-pharm-exam-v2";
const state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return Object.assign(defaults(), JSON.parse(raw));
  } catch (e) {}
  return defaults();
}
function defaults() {
  return {
    bookmarks: {},
    userNotes: {},
    view: "browse",       // "browse" | "starred"
    selectedArticle: null,
    expandedLaws: {},     // lawId -> bool (collapsed if false; default expanded)
    expandedParts: {},    // partId -> bool
    fullArticleOpen: {},  // articleId -> bool
    search: ""
  };
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

/* =========================================================
   HELPERS
   ========================================================= */
function lawById(id) { return DATA.laws.find(l => l.id === id); }
function partById(lawId, partId) {
  const l = lawById(lawId); if (!l) return null;
  return l.parts.find(p => p.id === partId);
}
function articleById(id) { return DATA.articles.find(a => a.id === id); }
function articlesForPart(partId) { return DATA.articles.filter(a => a.partId === partId); }
function articlesForLaw(lawId) { return DATA.articles.filter(a => a.lawId === lawId); }
function bookmarkedArticles() { return DATA.articles.filter(a => state.bookmarks[a.id]); }

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function highlight(text, query) {
  if (!query) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const re = new RegExp(`(${escapeRegex(query)})`, "gi");
  return escaped.replace(re, "<mark>$1</mark>");
}
function linkify(html) {
  // Convert URLs in already-escaped html into anchor tags
  return html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function searchScore(article, query) {
  if (!query) return 0;
  const q = query.toLowerCase();
  let score = 0;
  // Highest weight: title
  if (article.titleGr.toLowerCase().includes(q)) score += 100;
  // Notes (the user's key points) — strong weight: this is "first reference"
  for (const n of article.notes) {
    if (n.text.toLowerCase().includes(q)) score += 30 - (n.level * 3); // level 1 worth more than level 3
  }
  // Number / page literal match
  if (article.number.toLowerCase().includes(q)) score += 20;
  if (article.page && String(article.page) === q) score += 15;
  // Law / part
  const law = lawById(article.lawId);
  const part = partById(article.lawId, article.partId);
  if (law && (law.titleGr.toLowerCase().includes(q) || law.titleEn.toLowerCase().includes(q))) score += 8;
  if (part && part.titleGr.toLowerCase().includes(q)) score += 5;
  // Full text (when loaded)
  if (article.fullText && article.fullText.toLowerCase().includes(q)) score += 10;
  return score;
}

function searchResults(query) {
  if (!query) return [];
  const q = query.trim();
  if (!q) return [];
  const results = [];
  for (const a of DATA.articles) {
    const s = searchScore(a, q);
    if (s > 0) results.push({ article: a, score: s, snippet: bestSnippet(a, q) });
  }
  results.sort((a, b) => b.score - a.score);
  return results;
}

function bestSnippet(article, query) {
  // Find the best matching note line for the snippet preview
  const q = query.toLowerCase();
  for (const n of article.notes) {
    if (n.text.toLowerCase().includes(q)) return n.text;
  }
  if (article.titleGr.toLowerCase().includes(q)) return article.titleGr;
  if (article.notes.length) return article.notes[0].text;
  return "";
}

/* =========================================================
   LEGAL TEXT FORMATTER
   Turns raw PDF-extracted text (line-wrapped, flat) into
   structured HTML with proper paragraphs and indentation.
   ========================================================= */
function formatLegalText(rawText, q) {
  if (!rawText) return '';

  const lines = rawText.split('\n');
  const blocks = []; // { type: 'lead'|'para'|'sub'|'def', text: string }
  let current = null;

  const push = (type, text) => { current = { type, text }; blocks.push(current); };
  const append = text => {
    if (current) current.text += ' ' + text;
    else push('para', text);
  };

  for (const raw of lines) {
    const t = raw.trim();
    if (!t) continue;

    // Strip bare page-reference lines like "2/29", "14/29"
    if (/^\d+\/\d+$/.test(t)) continue;

    // Article lead line: "4.-(1)…" or "4Α.-(1)…"
    if (/^\d+[Α-Ωα-ω]?\.-/.test(t)) { push('lead', t); continue; }

    // Numbered sub-paragraph: "(1) …" — must be followed by a Greek letter (not a cross-ref like "(1) ανωτέρω")
    if (/^\(\d+\)\s+[Α-Ωα-ω]/.test(t)) { push('para', t); continue; }

    // Greek-letter sub-item: "(α) …", "(αα) …" — skip if it's a cross-ref joined by ή/και
    if (/^\([α-ωΑ-Ω]+\)/.test(t) && !/^\([α-ωΑ-Ω]+\)\s+(ή|και)[,\s]/.test(t)) {
      push('sub', t); continue;
    }

    // Definition term: line starting with an opening quote (straight, curly U+201C, or guillemet)
    if (/^["“"«]/.test(t)) { push('def', t); continue; }

    // Everything else is a continuation of the previous block (PDF line wrap)
    append(t);
  }

  if (blocks.length === 0) {
    // Fallback: no structure detected — just render as plain paragraphs split by newline
    return rawText.split('\n')
      .map(l => l.trim()).filter(Boolean)
      .map(l => `<p class="ft-para">${highlight(l, q)}</p>`).join('');
  }

  return blocks.map(b => {
    const c = highlight(b.text, q);
    switch (b.type) {
      case 'lead': return `<p class="ft-lead">${c}</p>`;
      case 'para': return `<p class="ft-para">${c}</p>`;
      case 'sub':  return `<p class="ft-sub">${c}</p>`;
      case 'def':  return `<p class="ft-def">${c}</p>`;
      default:     return `<p class="ft-para">${c}</p>`;
    }
  }).join('\n');
}

/* =========================================================
   RENDER
   ========================================================= */
const main = document.getElementById("main");

function render() {
  main.innerHTML = "";
  main.appendChild(renderSidebar());
  main.appendChild(renderReader());
}

function selectArticle(id) {
  // Save sidebar scroll position before any DOM change
  const sidebarList = document.querySelector(".sidebar-list");
  const scrollTop = sidebarList ? sidebarList.scrollTop : 0;

  // Update state
  state.selectedArticle = id;
  saveState();

  // Update active classes on sidebar items without rebuilding the sidebar
  document.querySelectorAll(".article-item[data-article-id], .search-result[data-article-id]").forEach(el => {
    el.classList.toggle("active", el.dataset.articleId === id);
  });

  // Swap only the reader panel
  const oldReader = document.querySelector(".reader");
  if (oldReader) {
    oldReader.replaceWith(renderReader());
  }

  // Restore sidebar scroll position
  const newSidebarList = document.querySelector(".sidebar-list");
  if (newSidebarList) newSidebarList.scrollTop = scrollTop;

  // Scroll the newly active item into view within the sidebar (never past the top)
  const activeItem = document.querySelector(".article-item.active, .search-result.active");
  if (activeItem) activeItem.scrollIntoView({ block: "nearest" });
}

function renderSidebar() {
  const side = document.createElement("aside");
  side.className = "sidebar";

  const controls = document.createElement("div");
  controls.className = "sidebar-controls";
  const search = document.createElement("input");
  search.type = "search";
  search.placeholder = "Search notes, articles, laws…";
  search.className = "search-box";
  search.value = state.search;
  search.addEventListener("input", (e) => {
    state.search = e.target.value;
    saveState();
    const list = side.querySelector(".sidebar-list");
    const info = side.querySelector(".search-info");
    list.replaceWith(renderSidebarList());
    info.replaceWith(renderSearchInfo());
  });
  controls.appendChild(search);
  controls.appendChild(renderSearchInfo());

  const toggle = document.createElement("div");
  toggle.className = "view-toggle";
  [["browse","Browse"], ["starred","★ Starred"]].forEach(([v, label]) => {
    const btn = document.createElement("button");
    btn.textContent = label;
    if (state.view === v) btn.classList.add("active");
    btn.addEventListener("click", () => { state.view = v; saveState(); render(); });
    toggle.appendChild(btn);
  });
  controls.appendChild(toggle);
  side.appendChild(controls);

  side.appendChild(renderSidebarList());
  return side;
}

function renderSearchInfo() {
  const info = document.createElement("div");
  info.className = "search-info";
  const q = state.search.trim();
  if (q) {
    const r = searchResults(q);
    info.textContent = `${r.length} result${r.length === 1 ? "" : "s"} for "${q}"`;
  } else {
    info.textContent = "";
  }
  return info;
}

function renderSidebarList() {
  const list = document.createElement("div");
  list.className = "sidebar-list";

  const q = state.search.trim();

  // SEARCH MODE: show ranked results, notes-first
  if (q) {
    const results = searchResults(q);
    if (results.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = `No matches for "${q}".`;
      list.appendChild(empty);
      return list;
    }
    for (const { article, snippet } of results) {
      const law = lawById(article.lawId);
      const item = document.createElement("div");
      item.className = "search-result";
      if (state.selectedArticle === article.id) item.classList.add("active");
      const pg = article.page ? `σ.${article.page}` : "";
      item.innerHTML = `
        <div class="sr-meta">
          <span>${escapeHtml(article.number)}</span>
          ${pg ? `<span class="pg-badge">${pg}</span>` : ""}
          <span style="margin-left:auto">${escapeHtml(law ? law.year : "")}</span>
        </div>
        <div class="sr-title">${highlight(article.titleGr, q)}</div>
        <div class="sr-snippet">${highlight(snippet, q)}</div>
      `;
      item.dataset.articleId = article.id;
      item.addEventListener("click", () => selectArticle(article.id));
      list.appendChild(item);
    }
    return list;
  }

  // STARRED MODE
  if (state.view === "starred") {
    const arts = bookmarkedArticles();
    if (arts.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No starred articles yet. Click the star on any article to save it here.";
      list.appendChild(empty);
      return list;
    }
    // Group by law
    const byLaw = {};
    for (const a of arts) {
      if (!byLaw[a.lawId]) byLaw[a.lawId] = [];
      byLaw[a.lawId].push(a);
    }
    for (const lawId of Object.keys(byLaw)) {
      const law = lawById(lawId);
      const block = document.createElement("div");
      block.className = "law-block";
      block.innerHTML = `
        <div class="law-header"><span class="chev">▼</span>
          <span class="law-title gr">${escapeHtml(law ? law.titleGr : lawId)}</span>
        </div>`;
      const body = document.createElement("div");
      body.className = "law-body";
      const al = document.createElement("div");
      al.className = "article-list";
      for (const a of byLaw[lawId]) al.appendChild(renderArticleItem(a));
      body.appendChild(al);
      block.appendChild(body);
      list.appendChild(block);
    }
    return list;
  }

  // BROWSE MODE: laws → parts → articles
  // Group definition: laws sharing the same umbrella legislation
  const LAW_GROUPS = [
    {
      label: "Ναρκωτικά Φάρμακα και Ψυχότροπες Ουσίες",
      lawIds: ["law-narcotics", "law-narcotics-kdp79", "law-narcotics-kdp19"]
    }
  ];
  const groupByLawId = {};
  for (const g of LAW_GROUPS) for (const id of g.lawIds) groupByLawId[id] = g.label;
  const groupContainers = {}; // label → DOM element

  function buildLawBlock(law) {
    const block = document.createElement("div");
    block.className = "law-block";
    // Default collapsed: treat undefined (never set) as collapsed; only true = expanded
    const collapsed = state.expandedLaws[law.id] !== true;
    if (collapsed) block.classList.add("collapsed");

    const header = document.createElement("div");
    header.className = "law-header";
    const totalArts = articlesForLaw(law.id).length;
    header.innerHTML = `<span class="chev">▼</span>
      <span class="law-title gr">${escapeHtml(law.titleGr)}</span>
      <span class="law-year">${escapeHtml(law.year)} · ${totalArts}</span>`;
    header.addEventListener("click", () => {
      // collapsed is captured at build time; toggle to opposite
      state.expandedLaws[law.id] = collapsed; // if was collapsed → set true → expanded; if expanded → set false → collapsed
      saveState();
      block.classList.toggle("collapsed");
    });
    block.appendChild(header);

    const body = document.createElement("div");
    body.className = "law-body";

    for (const part of law.parts) {
      const arts = articlesForPart(part.id);
      const pblock = document.createElement("div");
      pblock.className = "part-block";
      const pCollapsed = state.expandedParts[part.id] !== true;
      if (pCollapsed) pblock.classList.add("collapsed");
      const pTitle = document.createElement("div");
      pTitle.className = "part-title gr";
      pTitle.innerHTML = `<span class="chev2">▼</span>${escapeHtml(part.titleGr)} <span style="color:#b0b6c4;font-weight:400">(${arts.length})</span>`;
      pTitle.addEventListener("click", () => {
        state.expandedParts[part.id] = pCollapsed;
        saveState();
        pblock.classList.toggle("collapsed");
      });
      pblock.appendChild(pTitle);

      if (arts.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-part";
        empty.textContent = "(no notes yet for this part)";
        pblock.appendChild(empty);
      } else {
        const al = document.createElement("div");
        al.className = "article-list";
        for (const a of arts) al.appendChild(renderArticleItem(a));
        pblock.appendChild(al);
      }
      body.appendChild(pblock);
    }
    block.appendChild(body);
    return block;
  }

  for (const law of DATA.laws) {
    const block = buildLawBlock(law);
    const groupLabel = groupByLawId[law.id];
    if (groupLabel) {
      if (!groupContainers[groupLabel]) {
        const wrapper = document.createElement("div");
        wrapper.className = "law-group";
        const gh = document.createElement("div");
        gh.className = "law-group-header";
        gh.innerHTML = `<span class="gr">${escapeHtml(groupLabel)}</span>`;
        wrapper.appendChild(gh);
        groupContainers[groupLabel] = wrapper;
        list.appendChild(wrapper);
      }
      groupContainers[groupLabel].appendChild(block);
    } else {
      list.appendChild(block);
    }
  }
  return list;
}

function renderArticleItem(a) {
  const item = document.createElement("div");
  item.className = "article-item";
  if (state.selectedArticle === a.id) item.classList.add("active");
  const pg = a.page ? `<span class="pg-badge">σ.${a.page}</span>` : "";
  const star = state.bookmarks[a.id] ? '<span class="star">★</span>' : "";
  item.innerHTML = `<span class="num">${escapeHtml(a.number)}</span>
    <span class="label">${escapeHtml(a.titleGr)}</span>
    ${pg}${star}`;
  item.dataset.articleId = a.id;
  item.addEventListener("click", () => selectArticle(a.id));
  return item;
}
